<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoof Tracker - Command Center</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
        }
        #sidebar {
            width: 420px;
            background-color: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid #1f2937;
            background: #0f172a;
        }
        .sidebar-header h2 {
            margin: 0 0 10px 0;
            font-size: 19px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #38bdf8;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .btn-refresh {
            flex: 1;
            padding: 9px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-refresh:hover { background: #1d4ed8; }
        .auto-refresh {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }
        #device-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .device-card {
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            background: #182234;
            transition: border-color 0.2s;
        }
        .device-card.has-loc { border-left: 4px solid #10b981; }
        .device-card.no-loc { border-left: 4px solid #f59e0b; }
        .device-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .device-title h3 {
            margin: 0;
            font-size: 15px;
            color: #f8fafc;
            font-family: monospace;
        }
        .device-badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
        }
        .badge-live { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-waiting { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        
        .prop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            margin: 8px 0;
            font-size: 12px;
            color: #94a3b8;
        }
        .prop-item strong { color: #e2e8f0; }
        .prop-full { grid-column: 1 / -1; }
        
        .address-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #38bdf8;
            margin: 8px 0;
            line-height: 1.4;
        }
        
        .device-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .ping-btn {
            flex: 1;
            padding: 8px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        .ping-btn:hover { background-color: #059669; }
        .zoom-btn {
            padding: 8px 12px;
            background-color: #374151;
            color: #f8fafc;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .zoom-btn:hover { background-color: #4b5563; }
        .gmaps-link {
            display: inline-block;
            margin-top: 6px;
            font-size: 12px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }
        .gmaps-link:hover { text-decoration: underline; }
        #map { flex-grow: 1; height: 100vh; }
        .leaflet-popup-content-wrapper {
            background: #111827;
            color: #f8fafc;
            border: 1px solid #374151;
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
        }
        .leaflet-popup-tip { background: #111827; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h2>🛰️ Spoof Command Center</h2>
            <div class="header-actions">
                <button class="btn-refresh" onclick="fetchDevices()">🔄 Refresh List</button>
            </div>
            <label class="auto-refresh">
                <input type="checkbox" id="autoRefreshCheckbox" checked> Live auto-sync every 5s
            </label>
        </div>
        <div id="device-list">Connecting to telemetry network...</div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Leaflet CDN icon fix
        delete L.Icon.Default.prototype._getIconUrl;
        L.Icon.Default.mergeOptions({
            iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
            iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        });

        // Layer definitions
        const cartoVoyager = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© CARTO, OpenStreetMap'
        });

        const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '© Esri, Maxar, Earthstar Geographics'
        });

        const osmStreet = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        });

        const map = L.map('map', {
            center: [20, 0],
            zoom: 2,
            layers: [cartoVoyager]
        });

        L.control.layers({
            "Clean Map (CARTO)": cartoVoyager,
            "Satellite Imagery (Esri)": esriSatellite,
            "Street Map (OSM)": osmStreet
        }).addTo(map);

        const markers = {};
        let initialBoundsFitted = false;

        async function fetchDevices() {
            try {
                const response = await fetch('/api/admin/devices');
                const data = await response.json();
                
                const list = document.getElementById('device-list');

                if (!data.devices || data.devices.length === 0) {
                    list.innerHTML = '<p style="color:#94a3b8; text-align:center; margin-top:24px;">No registered devices found.</p>';
                    return;
                }

                list.innerHTML = '';
                const activeMarkers = [];

                data.devices.forEach(device => {
                    const hasLocation = device.location && device.location.latitude && device.location.longitude;
                    const card = document.createElement('div');
                    card.className = `device-card ${hasLocation ? 'has-loc' : 'no-loc'}`;

                    const lat = hasLocation ? device.location.latitude.toFixed(5) : null;
                    const lng = hasLocation ? device.location.longitude.toFixed(5) : null;
                    const gmapsUrl = hasLocation ? `https://www.google.com/maps?q=${device.location.latitude},${device.location.longitude}` : '';

                    const devInfo = device.deviceInfo || {};
                    const telemetry = device.telemetry || {};
                    const battery = telemetry.battery || devInfo.battery;
                    const network = telemetry.network || devInfo.network;
                    const locDetails = device.location || {};
                    const address = locDetails.address ? locDetails.address.formatted : null;

                    const batteryStr = battery ? `${battery.level} (${battery.stateText || (battery.isCharging ? 'Charging' : 'Unplugged')})` : 'Unknown';
                    const networkStr = network ? `${network.type || 'Connected'}` : 'Unknown';
                    const speedStr = locDetails.speed || 'Stationary';
                    const accuracyStr = locDetails.accuracy || 'N/A';
                    const altitudeStr = locDetails.altitude || 'N/A';
                    const headingStr = locDetails.heading || 'N/A';

                    const modelTitle = devInfo.brand ? `${devInfo.brand} ${devInfo.modelName}` : (device.deviceName || 'Android Device');

                    card.innerHTML = `
                        <div class="device-title">
                            <h3>${device.id}</h3>
                            <span class="device-badge ${hasLocation ? 'badge-live' : 'badge-waiting'}">
                                ${hasLocation ? '📍 Located' : '⏳ Waiting Ping'}
                            </span>
                        </div>
                        
                        <div class="prop-grid">
                            <div class="prop-item prop-full"><strong>Device:</strong> ${modelTitle} (Android ${devInfo.osVersion || '?'})</div>
                            <div class="prop-item"><strong>RAM:</strong> ${devInfo.totalMemory || 'N/A'}</div>
                            <div class="prop-item"><strong>IP:</strong> ${device.ipAddress || 'Unknown'}</div>
                            <div class="prop-item"><strong>Battery:</strong> ${batteryStr}</div>
                            <div class="prop-item"><strong>Network:</strong> ${networkStr}</div>
                            <div class="prop-item"><strong>Speed:</strong> ${speedStr}</div>
                            <div class="prop-item"><strong>Accuracy:</strong> ${accuracyStr}</div>
                            <div class="prop-item"><strong>Altitude:</strong> ${altitudeStr}</div>
                            <div class="prop-item"><strong>Heading:</strong> ${headingStr}</div>
                            <div class="prop-item prop-full"><strong>Last Ping:</strong> ${new Date(device.lastUpdated).toLocaleTimeString()}</div>
                        </div>

                        ${address ? `<div class="address-box">🏠 <strong>Address:</strong> ${address}</div>` : ''}
                        ${hasLocation ? `<a class="gmaps-link" href="${gmapsUrl}" target="_blank">↗ Open in Google Maps</a>` : ''}
                        
                        <div class="device-actions">
                            <button class="ping-btn" onclick="pingDevice('${device.id}', this)">📍 Ping Location</button>
                            ${hasLocation ? `<button class="zoom-btn" onclick="focusDevice('${device.id}')">🔍 Focus</button>` : ''}
                        </div>
                    `;
                    list.appendChild(card);

                    // Marker update
                    if (hasLocation) {
                        const latLng = [device.location.latitude, device.location.longitude];
                        activeMarkers.push(latLng);

                        const popupHtml = `
                            <div style="font-family:sans-serif; min-width:200px; line-height:1.4;">
                                <h4 style="margin:0 0 6px 0; color:#38bdf8; font-size:15px;">${modelTitle}</h4>
                                <div style="font-size:12px; margin-bottom:4px;"><b>Lat, Lng:</b> ${lat}, ${lng}</div>
                                <div style="font-size:12px; margin-bottom:4px;"><b>Accuracy:</b> ${accuracyStr} | <b>Speed:</b> ${speedStr}</div>
                                <div style="font-size:12px; margin-bottom:4px;"><b>Battery:</b> ${batteryStr}</div>
                                ${address ? `<div style="font-size:11px; margin-bottom:6px; color:#cbd5e1;"><b>Address:</b> ${address}</div>` : ''}
                                <a style="color:#10b981; font-weight:700; font-size:12px; text-decoration:none;" href="${gmapsUrl}" target="_blank">Open in Google Maps ↗</a>
                            </div>
                        `;

                        if (markers[device.id]) {
                            markers[device.id].setLatLng(latLng).setPopupContent(popupHtml);
                        } else {
                            markers[device.id] = L.marker(latLng).addTo(map).bindPopup(popupHtml);
                        }
                    }
                });

                // Auto zoom on first devices
                if (!initialBoundsFitted && activeMarkers.length > 0) {
                    const bounds = L.latLngBounds(activeMarkers);
                    map.fitBounds(bounds.pad(0.2), { maxZoom: 16 });
                    initialBoundsFitted = true;
                }

            } catch (error) {
                console.error("Error fetching devices:", error);
                document.getElementById('device-list').innerHTML = '<p style="color:#ef4444; text-align:center;">Failed to communicate with server.</p>';
            }
        }

        function focusDevice(deviceId) {
            if (markers[deviceId]) {
                const latLng = markers[deviceId].getLatLng();
                map.flyTo(latLng, 17, { duration: 1.2 });
                markers[deviceId].openPopup();
            }
        }

        async function pingDevice(deviceId, btn) {
            try {
                const originalText = btn.innerText;
                btn.innerText = 'Pinging...';
                btn.disabled = true;

                const response = await fetch(`/api/admin/ping/${deviceId}`, { method: 'POST' });
                const result = await response.json();

                if (response.ok) {
                    btn.innerText = '✅ Pinged!';
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.disabled = false;
                        fetchDevices();
                    }, 2500);
                } else {
                    alert('Error: ' + (result.error || 'Failed to ping'));
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                alert('Network error while pinging device');
                btn.innerText = '📍 Ping Location';
                btn.disabled = false;
            }
        }

        // Live refresh every 5 seconds
        setInterval(() => {
            const checkbox = document.getElementById('autoRefreshCheckbox');
            if (checkbox && checkbox.checked) {
                fetchDevices();
            }
        }, 5000);

        fetchDevices();
    </script>
</body>
</html>
